<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seawall Admin Console</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // the theme before the app loads, so a dark page doesn't flash white (src/theme.ts keeps it after)
      try {
        var m = localStorage.getItem('sw_theme')
        var dark = m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <style>
      /* until theme.css loads; the same as its --c-page-bg */
      html { background: #f5f7fa; }
      html[data-theme='dark'] { background: #0d1117; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
